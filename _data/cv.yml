- title: Research and Professional Experience
  type: time_table
  contents:
    - title: Research Fellow and Pre-Doctoral Trainee
      institution: University of Pennsylvania
      year: Aug 2021<br>– Present
      description:
        - Conduct doctoral research in applied mathematics, computational science, medical imaging, and computational neuroscience.
        - >-
          Develop statistical and computational methods integrating structural MRI, diffusion MRI, tractography, brain-network representations, and longitudinal mixed-effects modeling to characterize gray- and white-matter degeneration.
        - Current thesis work also informs broader research directions in scalable multimodal AI and foundation-model approaches for precision medicine.
    - title: Agentic AI Development
      institution: Wharton Research Data Services (WRDS), University of Pennsylvania
      year: Fall 2026<br>– Present
      description:
        - Contribute to agentic AI coding and application prototyping within the WRDS engineering team.
    - title: Research Assistant &amp; Software Developer, Digital Pathology
      institution: Case Western Reserve University
      year: Jun 2019<br>– 2021
      description:
        - Conducted NIH-funded research with Prof. Anant Madabhushi in computational medical imaging and digital pathology.
        - >-
          Developed Quick Annotator, a deep-learning-assisted pathology annotation platform using U-Net-based models to rapidly bootstrap region-of-interest annotations, including lymphocytes, nuclei, tubules, and tumor cells, with a Python, JavaScript, and SQL technology stack.
        - >-
          Contributed to development and maintenance of HistoQC for automated whole-slide image quality control. Developed C++ plugins for Sedeen Viewer by translating Python/MATLAB algorithms and integrated HistoQC functionality into the viewer.
    - title: Undergraduate Researcher, Image Processing
      institution: Case Western Reserve University
      year: May 2018<br>– Aug 2018
      description:
        - >-
          Conducted NSF-funded research with Prof. Weihong Guo on segmentation of cardiovascular disease-related images, including coronary artery imaging, using geometric-flow and variational PDE methods such as active contours, Chan–Vese models, level sets, and total variation.
        - Implemented and optimized MATLAB procedures with respect to neighborhood size, data sparsity, similarity measures, and numerical regularization.
        - >-
          Presented seminars on CT/MRI scanner systems and related applications and participated in seminars on image denoising, compression, deblurring, super-resolution, and compressive sensing.
    - title: SURES Undergraduate Researcher, Materials Science
      institution: Case Western Reserve University
      year: Feb 2018<br>– Aug 2018
      description:
        - Supported by the Summer Undergraduate Research in Energy and Sustainability (SURES) scholarship.
        - >-
          Developed lead-free CsGeI3 perovskite materials for solar-cell applications using physical vapor deposition (e-beam evaporation). Fabricated and characterized photovoltaic materials and devices using X-ray diffraction, UV-Visible spectroscopy, optical transparency, stylus profilometry, and X-ray photoelectron spectroscopy.
        - Hosted seminars in condensed-matter and solid-state physics and delivered poster and oral presentations at SURES CWRU in August 2018.
    - title: Physics Lab Assistant
      institution: Case Western Reserve University
      year: Aug 2017<br>– May 2018
      description:
        - >-
          Supported soft condensed-matter and semiconductor research by preparing materials, samples, and solutions for laboratory experiments, assisting with experimental procedures, and collaborating with faculty and graduate students in the Department of Physics on data analysis and modeling.

